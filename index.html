<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Robot Q&A</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:20px;background:linear-gradient(135deg,#06141f,#123b4d,#071b28);color:#fff}
.container{width:100%;max-width:650px;padding:25px;border-radius:26px;background:rgba(255,255,255,.1);backdrop-filter:blur(14px);box-shadow:0 15px 50px rgba(0,0,0,.45);text-align:center}
.robot{width:150px;margin:auto;animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.antenna{width:5px;height:25px;background:#00e5ff;margin:auto;box-shadow:0 0 12px #00e5ff}
.head{width:130px;height:100px;margin:auto;border:4px solid #00e5ff;border-radius:25px;background:#102b3a;position:relative;display:flex;justify-content:center;align-items:center;gap:25px;box-shadow:0 0 25px rgba(0,229,255,.4)}
.eye{width:18px;height:18px;border-radius:50%;background:#00e5ff;box-shadow:0 0 15px #00e5ff}
.mouth{position:absolute;bottom:15px;width:40px;height:5px;background:#00e5ff;border-radius:10px}
.body{width:100px;height:70px;margin:5px auto;border:4px solid #00e5ff;border-radius:15px;background:#102b3a}
h1{margin:12px 0 5px;font-size:28px}.subtitle{color:#b8e8f0;margin-bottom:20px}
.chat{height:280px;overflow-y:auto;padding:15px;border-radius:15px;background:rgba(0,0,0,.3);text-align:left;margin-bottom:15px}
.message{max-width:85%;padding:11px 14px;margin:8px 0;border-radius:14px;line-height:1.45}
.robot-msg{background:#07516a}.user-msg{background:#087f6b;margin-left:auto;text-align:right}
.input-area{display:flex;gap:8px}input{flex:1;min-width:0;padding:14px;border:0;outline:0;border-radius:12px;font-size:16px}
button{border:0;padding:14px 18px;border-radius:12px;background:#00d9ff;color:#00232c;font-weight:bold;cursor:pointer}
button:hover{transform:scale(1.03)}.clear{margin-top:12px;background:#ff5252;color:#fff}
@media(max-width:500px){.container{padding:18px}.input-area{flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<div class="container">
<div class="robot">
<div class="antenna"></div>
<div class="head"><div class="eye"></div><div class="eye"></div><div class="mouth"></div></div>
<div class="body"></div>
</div>

<h1>🤖 Smart Robot</h1>
<p class="subtitle">Ask me a question</p>

<div class="chat" id="chat">
<div class="message robot-msg">Hello! 👋<br>I am your Smart Robot.<br>Ask me a question!</div>
</div>

<div class="input-area">
<input id="question" type="text" placeholder="Type your question..." autocomplete="off">
<button onclick="askQuestion()">Ask 🤖</button>
</div>
<button class="clear" onclick="clearChat()">Clear Chat</button>
</div>

<script>
function askQuestion(){
 const input=document.getElementById("question"), chat=document.getElementById("chat");
 const question=input.value.trim();
 if(!question)return;
 addMessage(question,"user-msg");
 addMessage(getAnswer(question),"robot-msg");
 input.value=""; chat.scrollTop=chat.scrollHeight;
}
function addMessage(text,cls){
 const div=document.createElement("div");
 div.className="message "+cls; div.textContent=text;
 document.getElementById("chat").appendChild(div);
}
function getAnswer(question){
 const q=question.toLowerCase().trim();
 if(q.includes("hello")||q.includes("hi")||q.includes("hey")) return "Hello! 👋 How can I help you?";
 if(q.includes("your name")||q.includes("who are you")) return "I am Smart Robot 🤖.";
 if(q.includes("how are you")) return "I am great! 😊 Thanks for asking.";
 if(q.includes("capital of india")) return "The capital of India is New Delhi. 🇮🇳";
 if(q.includes("prime minister of india")) return "The Prime Minister of India is Narendra Modi.";
 if(q.includes("2+2")||q.includes("2 + 2")) return "The correct answer is 4. ✅";
 if(q.includes("5+5")||q.includes("5 + 5")) return "The correct answer is 10. ✅";
 if(q.includes("10+10")||q.includes("10 + 10")) return "The correct answer is 20. ✅";
 if(q.includes("largest planet")) return "Jupiter is the largest planet in our Solar System. 🪐";
 if(q.includes("smallest planet")) return "Mercury is the smallest planet in our Solar System.";
 if(q.includes("7 continents")||q.includes("seven continents")) return "There are 7 continents: Asia, Africa, Europe, North America, South America, Australia and Antarctica.";
 if(q.includes("5 oceans")||q.includes("five oceans")) return "The 5 oceans are Pacific, Atlantic, Indian, Southern and Arctic.";
 if(q.includes("fastest animal")) return "The Peregrine Falcon is the fastest animal.";
 if(q.includes("nearest star")||q.includes("closest star")) return "The Sun is the closest star to Earth. ☀️";
 if(q.includes("which planet do we live")||q.includes("planet do we live")) return "We live on planet Earth. 🌍";
 if(q.includes("formula of water")) return "The chemical formula of water is H₂O.";
 if(q.includes("bye")||q.includes("goodbye")) return "Goodbye! 👋 Have a great day!";
 return "Sorry 🤔, I don't know that answer yet. Try another question.";
}
function clearChat(){
 document.getElementById("chat").innerHTML='<div class="message robot-msg">Chat cleared! 👋<br>Ask me a new question.</div>';
}
document.getElementById("question").addEventListener("keydown",e=>{if(e.key==="Enter")askQuestion()});
</script>
</body>
</html>
